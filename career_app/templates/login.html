{% extends 'base.html' %}
{% block content %}
<div class="auth-page">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card auth-card shadow border-0">
                    <div class="card-body p-4 p-md-5">
                        <h3 class="text-center mb-4"><i class="fas fa-sign-in-alt me-2"></i>Login</h3>
                        <form method="post" action="{% url 'login' %}">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <input type="text" name="username" class="form-control form-control-lg" placeholder="Username" required autofocus>
                            </div>
                            <div class="mb-4">
                                <label class="form-label">Password</label>
                                <input type="password" name="password" class="form-control form-control-lg" placeholder="Password" required>
                            </div>
                            <div class="d-flex flex-column flex-sm-row gap-2 justify-content-center">
                            <button type="submit" class="btn btn-primary btn-lg rounded-pill flex-grow-1 flex-sm-grow-0 px-4">Login</button>
                            <a href="{% url 'signup' %}" class="btn btn-outline-primary btn-lg rounded-pill flex-grow-1 flex-sm-grow-0 px-4 text-center">Sign Up</a>
                        </div>
                        </form>
                        <p class="text-center mt-4 mb-0 text-muted">Don't have an account? <a href="{% url 'signup' %}">Sign up</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
